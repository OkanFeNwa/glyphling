<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Glyphling · menu</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Notification area icon menu, like the glass one in the prototype. The window is
   transparent and as big as the menu: the backend resizes it and places it near the icon. */
:root { --red: #d71921; --ink: #f2f2f2; --mute: #a3a3a3; --glass: #121214;
  --dot: "Nothing Dot Local", "Glyphling Dot", "Doto", monospace; --mono: "Space Mono", ui-monospace, monospace; color-scheme: dark; }
html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
body { padding: 0; }
.tmenu { width: 228px; padding: 6px; border-radius: 16px; box-sizing: border-box; display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.02) 40%, rgba(255,255,255,.03) 100%), linear-gradient(160deg, color-mix(in srgb, var(--glass) 70%, #2a2a2a), color-mix(in srgb, var(--glass) 85%, #0c0c0c));
  border: 1px solid rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); transform-origin: 85% 100%; }
.tmenu.opening { animation: pop .26s cubic-bezier(.2,1.3,.4,1); }
@keyframes pop { 0% { opacity: 0; transform: scale(.85); } 100% { opacity: 1; transform: none; } }
.mh { padding: 8px 10px 6px; font: 400 9px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--mute); display: flex; justify-content: space-between; align-items: baseline; }
.mh b { font-family: var(--dot); font-weight: 900; font-size: 13px; letter-spacing: .06em; color: var(--ink); }
.sec { padding: 6px 10px 2px; font: 400 8px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
button { appearance: none; border: 0; background: none; color: var(--ink); text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; font: 400 11px/1.2 var(--mono); }
button:hover, button:focus-visible { background: rgba(255,255,255,.08); outline: none; }
.ic { width: 15px; height: 15px; flex: none; opacity: .9; }
.ck { width: 9px; height: 9px; flex: none; margin-left: auto; display: grid; place-items: center; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
button[aria-checked="true"] .ck { box-shadow: none; background: var(--red); }
button[aria-checked="false"] { color: var(--mute); }
button[aria-checked="false"]:hover { color: var(--ink); }
.lv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 2px 6px 4px; }
.lv button { justify-content: center; text-align: center; white-space: nowrap; padding: 6px 4px; font-size: 9px; letter-spacing: .06em; border: 1px solid rgba(255,255,255,.08); border-radius: 999px; }
.lv button[aria-checked="true"] { border-color: var(--red); color: var(--ink); background: color-mix(in srgb, var(--red) 16%, transparent); }
hr { border: 0; height: 1px; background: rgba(255,255,255,.08); margin: 5px 6px; }
</style>
</head>
<body>
<div class="tmenu" id="m" role="menu" aria-label="Glyphling"></div>
<script>
(() => {
  const { invoke } = window.__TAURI__.core, { listen } = window.__TAURI__.event;
  const m = document.getElementById('m');
  const LEVELS = [['desktop', 'Desktop'], ['normal', 'Normale'], ['top', 'In alto']];
  // Lucide icons (ISC license, lucide.dev)
  const ICONS = {
    "sleep": "<path d=\"M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z\" />",
    "move": "<path d=\"M12 2v20\" /><path d=\"m15 19-3 3-3-3\" /><path d=\"m19 9 3 3-3 3\" /><path d=\"M2 12h20\" /><path d=\"m5 9-3 3 3 3\" /><path d=\"m9 5 3-3 3 3\" />",
    "snap": "<rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\" /><path d=\"M3 9h18\" /><path d=\"M3 15h18\" /><path d=\"M9 3v18\" /><path d=\"M15 3v18\" />",
    "show": "<path d=\"M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0\" /><circle cx=\"12\" cy=\"12\" r=\"3\" />",
    "hide": "<path d=\"M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49\" /><path d=\"M14.084 14.158a3 3 0 0 1-4.242-4.242\" /><path d=\"M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143\" /><path d=\"m2 2 20 20\" />",
    "settings": "<path d=\"M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z\" /><circle cx=\"12\" cy=\"12\" r=\"3\" />",
    "info": "<circle cx=\"12\" cy=\"12\" r=\"10\" /><path d=\"M12 16v-4\" /><path d=\"M12 8h.01\" />",
    "quit": "<path d=\"M12 2v10\" /><path d=\"M18.4 6.6a9 9 0 1 1-12.77.04\" />"
    };
  const svg = name => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
  const item = (id, text, checked, icon = id) => `<button role="${checked == null ? 'menuitem' : 'menuitemcheckbox'}" data-id="${id}"${checked == null ? '' : ` aria-checked="${checked}"`}>${svg(icon)}<span>${text}</span>${checked == null ? '' : '<span class="ck"></span>'}</button>`;
  function colors() {
    try {
      const c = JSON.parse(localStorage.getItem('glyphling-menu-colors') || 'null');
      if (c) for (const k of ['red', 'ink', 'glass']) if (c[k]) document.documentElement.style.setProperty('--' + k, c[k]);
    } catch (e) {}
  }
  function render({ cfg, version }) {
    colors();
    m.innerHTML = `<div class="mh"><b>Glyphling</b>v${version}</div>`
      + (cfg.mode === 'idle' ? item('sleep', 'Fai dormire / sveglia') : '')
      + item('move', 'Sposta il widget', !!cfg.move_enabled)
      + item('snap', 'Aggancio alla griglia', !!cfg.snap)
      + item('show', cfg.visible ? 'Nascondi il widget' : 'Mostra il widget', null, cfg.visible ? 'hide' : 'show')
      + '<div class="sec">Livello</div><div class="lv">'
      + LEVELS.map(([id, n]) => `<button role="menuitemradio" aria-checked="${cfg.level === id}" data-id="level:${id}">${n}</button>`).join('')
      + '</div><hr>'
      + item('settings', 'Impostazioni…') + item('info', 'Info su Glyphling')
      + '<hr>' + item('quit', 'Esci');
    // measure without the animation (which scales the menu), then start it
    invoke('menu_place', { w: m.offsetWidth, h: m.offsetHeight });
    m.classList.remove('opening'); void m.offsetWidth; m.classList.add('opening');
  }
  listen('menu-open', e => render(e.payload));
  m.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    invoke('menu_action', { id: b.dataset.id });
  });
  addEventListener('blur', () => invoke('menu_hide'));
  addEventListener('keydown', e => {
    const items = [...m.querySelectorAll('button')], i = items.indexOf(document.activeElement);
    if (e.key === 'Escape') invoke('menu_hide');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); }
  });
  addEventListener('contextmenu', e => e.preventDefault());
})();
</script>
</body>
</html>
